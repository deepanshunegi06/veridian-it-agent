# Veridian Corp IT knowledge base, transcribed from the assignment data pack.
#
# Every clause is a separate entry with its own id. That is the whole point: an
# answer cites the clause it rests on, not the article it came from, so a
# reviewer can see the exact sentence that justified a decision.
#
# `authority` is who may actually approve the thing. It is what stops the agent
# answering for a queue it does not own -- expense-tool access belongs to
# Finance, and saying so is more useful than guessing at IT's own rules.

- id: KB-01
  title: Password Reset
  source: Knowledge Base
  authority: IT
  text: >-
    Employees can reset their own password via the self-service portal at any
    time. If locked out after 5 failed attempts, contact IT to unlock the
    account manually. No approval required.
  keywords: [password, reset, locked out, lockout, login, attempts, portal]

- id: KB-02
  title: VPN Access
  source: Knowledge Base
  authority: IT
  text: >-
    VPN access is granted automatically to all full-time employees. Contractors
    require manager approval submitted via the access request form. VPN
    credentials expire every 90 days and must be renewed by the employee.
  keywords: [vpn, remote access, credentials, expired, contractor, renew]

- id: KB-03
  title: Laptop Replacement
  source: Knowledge Base
  authority: IT
  text: >-
    Laptops are eligible for replacement after 3 years of service, or earlier in
    case of verified hardware failure. Requests must be raised at least 2 weeks
    in advance of intended replacement.
  keywords: [laptop, replacement, hardware, dead, broken, screen, years, refresh]
  # See ASSET-01. These two do not agree, and the agent must not pick one.
  conflicts_with: [ASSET-01]

- id: KB-04
  title: Software Installation Requests
  source: Knowledge Base
  authority: IT Security
  text: >-
    Standard software (listed in the approved catalog) can be self-installed.
    Non-catalog software requires IT Security review, which takes 3-5 business
    days.
  keywords: [software, install, catalog, extension, tool, security review, approval]

- id: KB-05
  title: Printer Troubleshooting
  source: Knowledge Base
  authority: IT
  text: >-
    For printer issues, first check the printer queue and restart the print
    spooler. If the issue persists after restart, log a ticket with the
    printer's asset tag.
  keywords: [printer, print, jam, spooler, queue, asset tag]

- id: KB-06
  title: Email Mailbox Quota
  source: Knowledge Base
  authority: IT
  text: >-
    Default mailbox quota is 25GB. Employees nearing quota should archive old
    mail. Quota increases beyond 25GB require manager approval and are capped at
    50GB.
  keywords: [mailbox, email, quota, full, storage, archive, gb]

- id: KB-07
  title: Guest Wi-Fi Access
  source: Knowledge Base
  authority: Employee self-service
  text: >-
    Guest Wi-Fi credentials are valid for 24 hours and can be generated by any
    employee from the front-desk kiosk. No IT ticket required.
  keywords: [guest, wifi, wi-fi, visitor, kiosk, network]

- id: KB-08
  title: Expense Software Access
  source: Knowledge Base
  authority: Finance
  text: >-
    Access to the expense management tool is granted by Finance, not IT. IT can
    only assist with login/technical issues once an account already exists.
  keywords: [expense, expense tool, reimbursement, access, finance, login]

- id: KB-09
  title: Security Incident Reporting
  source: Knowledge Base
  authority: Security
  text: >-
    Any suspected phishing email, malware, or unauthorized access attempt must
    be reported to security@veridian-corp.example immediately and should not be
    forwarded to other employees.
  keywords: [phishing, malware, security, suspicious, incident, unauthorized, forward]

- id: KB-10
  title: Work-From-Home Equipment
  source: Knowledge Base
  authority: Manager and Finance
  text: >-
    Employees working remotely more than 3 days/week are eligible for a one-time
    home office equipment allowance (chair, monitor). Requires manager sign-off
    and Finance processing - IT only handles the equipment shipping request once
    approved.
  keywords: [work from home, wfh, remote, monitor, chair, equipment, allowance, home office]

- id: ASSET-01
  title: Hardware Refresh Cycle
  source: Asset Management Policy (Finance & Assets, last updated Q2 2026)
  authority: Finance and IT
  text: >-
    All company-issued hardware, including laptops and monitors, follows a
    standard 4-year refresh cycle from date of issue. Early replacement outside
    this cycle requires Finance sign-off in addition to IT approval.
  keywords: [laptop, hardware, refresh, replacement, monitor, 4-year, finance, cycle]
  # The eligibility age here is four years; KB-03 says three. A laptop between
  # three and four years old is simultaneously eligible and not eligible, and
  # nothing in the supplied material resolves it.
  conflicts_with: [KB-03]
